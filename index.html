const $=s=>document.querySelector(s);const icon=(name)=>{let c={照片:['#fff','<g transform="translate(32 32)"><ellipse cy="-13" rx="8" ry="16" fill="#ffb42d"/><ellipse cy="-13" rx="8" ry="16" fill="#f04b4f" transform="rotate(45)"/><ellipse cy="-13" rx="8" ry="16" fill="#a644bd" transform="rotate(90)"/><ellipse cy="-13" rx="8" ry="16" fill="#4b86e8" transform="rotate(135)"/><ellipse cy="-13" rx="8" ry="16" fill="#48b9dd" transform="rotate(180)"/><ellipse cy="-13" rx="8" ry="16" fill="#55bd70" transform="rotate(225)"/><ellipse cy="-13" rx="8" ry="16" fill="#e1cb3b" transform="rotate(270)"/><ellipse cy="-13" rx="8" ry="16" fill="#ff893c" transform="rotate(315)"/></g>'],日历:['#fff','<text x="32" y="43" text-anchor="middle" font-size="36" font-weight="600" fill="#ec4c4c">'+new Date().getDate()+'</text>'],天气:['#4aaff6','<circle cx="32" cy="32" r="15" fill="#ffda36"/><g stroke="#ffda36" stroke-width="3"><path d="M32 7v7M32 50v7M7 32h7M50 32h7M14 14l5 5M45 45l5 5M50 14l-5 5M19 45l-5 5"/></g>'],时钟:['#101014','<circle cx="32" cy="32" r="23" fill="none" stroke="white" stroke-width="3"/><path d="M32 16v17l12 8" stroke="white" stroke-width="3" fill="none"/>'],KakaoTalk:['#fee500','<path fill="#3c1e1e" d="M32 11C17 11 6 20 6 31c0 8 5 14 12 18l-3 10 12-7c2 .3 4 .5 5 .5 15 0 26-9 26-21S47 11 32 11z"/>'],Instagram:['linear-gradient(40deg,#ffcf52,#f33366,#8b35c9)','<rect x="14" y="14" width="36" height="36" rx="11" stroke="white" stroke-width="4" fill="none"/><circle cx="32" cy="32" r="9" stroke="white" stroke-width="4" fill="none"/><circle cx="43" cy="21" r="3" fill="white"/>'],X:['#050505','<path d="M14 12h10l27 40H41L14 12zm2 40 33-40" stroke="white" stroke-width="3" fill="none"/>'],Spotify:['#151515','<circle cx="32" cy="32" r="26" fill="#1db954"/><path d="M16 26q18-7 34 4M18 34q17-5 30 4M21 41q14-3 25 3" stroke="#111" stroke-width="4" fill="none" stroke-linecap="round"/>'],YouTube:['#fff','<rect x="8" y="17" width="48" height="30" rx="9" fill="#ff0033"/><path d="M28 23l15 9-15 9z" fill="white"/>'],备忘录:['#fff','<path d="M12 11h40v42H12z" fill="#fff" stroke="#ddd"/><path d="M12 11h40" stroke="#ffd441" stroke-width="8"/><path d="M18 27h28M18 34h28M18 41h24" stroke="#aaa" stroke-width="2"/>'],音乐:['#fa426b','<path d="M28 13v34a8 8 0 1 1-4-7V19l25-6v29a8 8 0 1 1-4-7V9z" fill="white"/>'],电话:['#45c85a','<text x="32" y="45" text-anchor="middle" font-size="37" fill="white">☎</text>'],信息:['#4bcb5b','<path d="M10 14h44v31H31L19 54v-9h-9z" fill="white"/>'],相机:['#dedee2','<rect x="9" y="20" width="46" height="31" rx="7" fill="#444"/><circle cx="32" cy="35" r="12" fill="#aeb7c5" stroke="#777" stroke-width="3"/>'],邮件:['#258bf4','<path d="M9 18h46v29H9z" fill="white"/><path d="M9 18l23 19 23-19" stroke="#258bf4" stroke-width="3" fill="none"/>'],通讯录:['#ddd','<circle cx="32" cy="24" r="10" fill="#777"/><path d="M13 51q0-17 19-17t19 17" fill="#777"/>'],设置:['#a7a9ae','<text x="32" y="45" text-anchor="middle" font-size="39" fill="#555">⚙</text>'],文件:['#fff','<path d="M8 21h19l5 6h24v24H8z" fill="#419afa"/>'],提醒事项:['#fff','<path d="M22 20h29M22 33h29M22 46h29" stroke="#777" stroke-width="3"/><circle cx="13" cy="20" r="3" fill="#ffad3c"/><circle cx="13" cy="33" r="3" fill="#3ba7ff"/><circle cx="13" cy="46" r="3" fill="#a879f8"/>'],计算器:['#333','<text x="32" y="43" text-anchor="middle" font-size="28" fill="white">＋−</text>'],地图:['#e8f3ec','<path d="M10 9l15 6 15-6 14 6v40l-14-6-15 6-15-6z" fill="#92d7b4"/><path d="M25 15v40M40 9v40" stroke="white" stroke-width="3"/>'],NAVER:['#03c75a','<text x="32" y="46" text-anchor="middle" font-size="42" font-weight="900" fill="white">N</text>']};let x=c[name]||['#bbb','<circle cx="32" cy="32" r="19" fill="white"/>'];return `<svg viewBox="0 0 64 64" aria-hidden="true" style="width:100%;height:100%;background:${x[0]}">${x[1]}</svg>`};
function renderNotifications(){let root=document.querySelector('#notif');root.innerHTML='';CONFIG.notifications.forEach(n=>{let e=document.createElement('div');e.className='notification-row';let ico=document.createElement('div');ico.className='notification-icon';ico.innerHTML=icon(n.app);let content=document.createElement('div');content.className='notification-copy';let top=document.createElement('div');top.className='notification-top';let title=document.createElement('strong');title.textContent=n.app;let time=document.createElement('time');time.textContent=n.time;top.append(title,time);let line=document.createElement('div');line.className='notification-text';line.textContent=n.sender+'：'+n.text;content.append(top,line);e.append(ico,content);e.onclick=()=>{show('pass')};root.appendChild(e)})};renderNotifications();
let appNames=['照片','日历','天气','时钟','KakaoTalk','Instagram','X','Spotify','YouTube','备忘录','音乐','NAVER','工具'];let tools=['邮件','通讯录','设置','文件','提醒事项','计算器','地图'];const appNode=(name,mini=false)=>{let e=document.createElement('div');e.className='app';let i=document.createElement('div');i.className='appicon'+(name==='工具'?' folderpreview':'');if(name==='工具'){tools.slice(0,9).forEach(t=>{let m=document.createElement('div');m.className='mini';m.innerHTML=icon(t);i.appendChild(m)})}else i.innerHTML=icon(name);e.appendChild(i);if(!mini){let n=document.createElement('div');n.className='appname';n.textContent=name;e.appendChild(n)}e.onclick=()=>name==='工具'?openFolder():openApp(name);return e};appNames.forEach(n=>$('#apps').appendChild(appNode(n)));['电话','KakaoTalk','信息','相机'].forEach(n=>$('#dock').appendChild(appNode(n,true)));tools.forEach(n=>$('#folderbox').appendChild(appNode(n)));
function clock(){let d=new Date(),t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('#locktime').textContent=t;$('#statusleft').textContent=$('#lock').classList.contains('active')?t:t;$('#date').textContent=`${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`};setInterval(clock,1000);clock();function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');clock()}let typed='';function dots(){$('#dots').innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<typed.length?'fill':''}"></span>`).join('')};dots();['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(n=>{let b=document.createElement('button');b.className='digit';b.textContent=n;b.onclick=()=>{if(n==='⌫')typed=typed.slice(0,-1);else if(n&&typed.length<4)typed+=n;dots();if(typed.length===4){if(typed===CONFIG.password){show('home');typed='';dots()}else{$('#passmsg').textContent='密码错误，请重试';setTimeout(()=>{typed='';dots();$('#passmsg').textContent=''},500)}}};$('#pad').appendChild(b)});let sy=0;$('#lock').addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});$('#lock').addEventListener('touchend',e=>{if(sy-e.changedTouches[0].clientY>45)show('pass')});$('#lock').addEventListener('mousedown',e=>sy=e.clientY);$('#lock').addEventListener('mouseup',e=>{if(sy-e.clientY>40)show('pass')});$('#globalbar').onclick=()=>{$('#lock').classList.contains('active')?show('pass'):goHome()};function goHome(){$('#appview').classList.remove('show');closeFolder();show('home')};function openFolder(){$('#folder').classList.add('show')};function closeFolder(){$('#folder').classList.remove('show')};let chatStep=0;function openApp(name){closeFolder();if(!$('#home').classList.contains('active'))show('home');$('#appview').classList.add('show');let c=$('#appcontent');c.innerHTML='<h1>'+name+'</h1>';if(name==='KakaoTalk'||name==='信息'){c.innerHTML='<h1>'+name+'</h1><div id="messages"></div><div class="chatinput"><input id="reply" placeholder="输入消息…"><button id="send">发送</button></div>';chatStep=0;appendMsg(CONFIG.chat[0].text,false);$('#send').onclick=()=>{let m=CONFIG.chat[1];appendMsg(m.text,true);$('#reply').value='';setTimeout(()=>appendMsg(CONFIG.chat[2].text,false),800)}}else if(name==='X'){c.innerHTML='<h1>X</h1><div class="hint">私人账号 🔒</div>'+CONFIG.tweets.map(t=>'<div class="item">'+t+'</div>').join('')}else if(name==='电话'){c.innerHTML='<h1>最近通话</h1><div class="item">今天</div><div class="item">未接来电　19:42</div><div class="item">昨天</div><div class="item">已接来电　21:07</div>'}else{c.innerHTML+='<p class="hint">应用界面将在后续版本完善。</p>'}}function appendMsg(t,mine){let b=document.createElement('div');b.className='bubble';if(!mine){b.style.marginLeft='0';b.style.background='#fff'}b.textContent=t;$('#messages').appendChild(b)};
</script></body></html>
