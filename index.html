/* Full viewport and safe-area layout for iOS installed web app */
html,body{height:100%;height:100dvh;background:#111}#phone{height:100dvh;min-height:100dvh}#wall{background-position:center center}

.app-page{width:50%;flex:0 0 50%;padding:0 1px}
.page-dots{position:absolute;bottom:2px;left:0;right:0;display:flex;gap:7px;justify-content:center}

const $=s=>document.querySelector(s);const icon=(name)=>{let c={照片:['#fff','<g transform="translate(32 32)"><ellipse cy="-13" rx="8" ry="16" fill="#ffb42d"/><ellipse cy="-13" rx="8" ry="16" fill="#f04b4f" transform="rotate(45)"/><ellipse cy="-13" rx="8" ry="16" fill="#a644bd" transform="rotate(90)"/><ellipse cy="-13" rx="8" ry="16" fill="#4b86e8" transform="rotate(135)"/><ellipse cy="-13" rx="8" ry="16" fill="#48b9dd" transform="rotate(180)"/><ellipse cy="-13" rx="8" ry="16" fill="#55bd70" transform="rotate(225)"/><ellipse cy="-13" rx="8" ry="16" fill="#e1cb3b" transform="rotate(270)"/><ellipse cy="-13" rx="8" ry="16" fill="#ff893c" transform="rotate(315)"/></g>'],日历:['#fff','<text x="32" y="43" text-anchor="middle" font-size="36" font-weight="600" fill="#ec4c4c">'+new Date().getDate()+'</text>'],天气:['#4aaff6','<circle cx="32" cy="32" r="15" fill="#ffda36"/><g stroke="#ffda36" stroke-width="3"><path d="M32 7v7M32 50v7M7 32h7M50 32h7M14 14l5 5M45 45l5 5M50 14l-5 5M19 45l-5 5"/></g>'],时钟:['#fff','<circle cx="32" cy="32" r="25" fill="white" stroke="#dedede"/><g stroke="#222" stroke-width="1.2"><path d="M32 9v5M32 50v5M9 32h5M50 32h5"/></g><text x="32" y="18" text-anchor="middle" font-size="7" fill="#222">12</text><text x="48" y="35" text-anchor="middle" font-size="7" fill="#222">3</text><text x="32" y="52" text-anchor="middle" font-size="7" fill="#222">6</text><text x="16" y="35" text-anchor="middle" font-size="7" fill="#222">9</text><path d="M32 32L27 21M32 32L43 27" stroke="#111" stroke-width="2" stroke-linecap="round"/><path d="M32 32L39 13" stroke="#ff8b17" stroke-width="1.2"/><circle cx="32" cy="32" r="2" fill="#222"/>'],KakaoTalk:['#fee500','<path fill="#3c1e1e" d="M32 11C17 11 6 20 6 31c0 8 5 14 12 18l-3 10 12-7c2 .3 4 .5 5 .5 15 0 26-9 26-21S47 11 32 11z"/>'],Instagram:['linear-gradient(40deg,#ffcf52,#f33366,#8b35c9)','<rect x="14" y="14" width="36" height="36" rx="11" stroke="white" stroke-width="4" fill="none"/><circle cx="32" cy="32" r="9" stroke="white" str function renderNotifications(){let root=document.querySelector('#notif');root.innerHTML='';CONFIG.notifications.forEach(n=>{let e=document.createElement('div');e.className='notification-row';let ico=document.createElement('div');ico.className='notification-icon';ico.innerHTML=icon(n.app);let content=document.createElement('div');content.className='notification-copy';let top=document.createElement('div');top.className='notification-top';let title=document.createElement('strong');title.textContent=n.app;let time=document.createElement('time');time.textContent=n.time;top.append(title,time);let line=document.createElement('div');line.className='notification-text';line.textContent=n.sender+'：'+n.text;content.append(top,line);e.append(ico,content);e.onclick=()=>{show('pass')};root.appendChild(e)})};renderNotifications();

const originalIcon=icon;
const refinedIcon=(name)=>{
 const svg=(bg,body)=>`<div style="width:100%;height:100%;background:${bg};display:grid;place-items:center"><svg viewBox="0 0 64 64" style="width:100%;height:100%">${body}</svg></div>`;

 if(name==='相机')return svg('linear-gradient(#e9e9eb,#bfc0c5)','<rect x="6" y="15" width="52" height="36" rx="7" fill="#3d3e43"/><circle cx="32" cy="33" r="16" fill="#636c78"/><circle cx="32" cy="33" r="12" fill="#9daec3"/><circle cx="32" cy="33" r="9" fill="#647e9e"/><circle cx="32" cy="33" r="5" fill="#b2c8e6"/>');
 if(name==='网易云音乐')return svg('#e93834','<circle cx="32" cy="32" r="23" fill="none" stroke="white" stroke-width="3"/><path d="M15 37q5 8 15 5t9-12q-5-5-11 1t-2 8q8 3 16-8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>');
 if(name==='美图秀秀')return svg('#ff73a6','<text x="32" y="44" font-size="31" fill="white" text-anchor="middle" font-weight="700">美</text>');
 if(name==='醒图')return svg('#121212','<text x="32" y="44" font-size="29" fill="white" text-anchor="middle" font-weight="600">醒</text>');
 if(name==='Safari')return svg('#fff','<circle cx="32" cy="32" r="25" fill="#19a9e9"/><circle cx="32" cy="32" r="21" fill="none" stroke="white" stroke-width="1"/><path d="M42 20L28 29 22 44l14-11z" fill="white"/><path d="M42 20L32 32l-4-3z" fill="#f44"/>');
 if(name==='App Store')return svg('#168cff','<g stroke="white" stroke-width="5" stroke-linecap="round"><path d="M20 45h28M20 19l24 40M44 19L20 59"/></g>');
 if(name==='健康')return svg('#fff','<path d="M32 51C19 40 9 34 9 23 9 12 24 9 32 20c8-11 23-8 23 3 0 11-10 17-23 28" fill="#ff2764"/>');

let appNames=['照片','日历','天气','时钟','KakaoTalk','Instagram','X','Spotify','YouTube','备忘录','音乐','NAVER','工具'];let tools=['邮件','通讯录','设置','文件','提醒事项','计算器','地图'];const appNode=(name,mini=false)=>{let e=document.createElement('div');e.className='app';let i=document.createElement('div');i.className='appicon'+(name==='工具'?' folderpreview':'');if(name==='工具'){tools.slice(0,9).forEach(t=>{let m=document.createElement('div');m.className='mini';m.innerHTML=refinedIcon(t);i.appendChild(m)})}else i.innerHTML=refinedIcon(name);e.appendChild(i);if(!mini){let n=document.createElement('div');n.className='appname';n.textContent=name;e.appendChild(n)}e.onclick=()=>name==='工具'?openFolder():openApp(name);return e};appNames.forEach(n=>$('#apps').appendChild(appNode(n)));['网易云音乐','美图秀秀','醒图','Safari','地图','计算器','App Store','健康','设置','文件','提醒事项','相册'].forEach(n=>$('#apps2').appendChild(appNode(n)));let page=0,startX=0;const track=$('#pageTrack');function setPage(n){page=Math.max(0,Math.min(1,n));track.style.transform=`translateX(-${page*50}%)`;document.querySelectorAll('.page-dots span').forEach((e,i)=>e.classList.toggle('selected',i===page))}$('#home').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('#home').addEventListener('touchend',e=>{let delta=e.changedTouches[0].clientX-startX;if(Math.abs(delta)>55&&!$('#folder').classList.contains('show'))setPage(page+(delta<0?1:-1))},{passive:true});['电话','KakaoTalk','信息','相机'].forEach(n=>$('#dock').appendChild(appNode(n,true)));tools.forEach(n=>$('#folderbox').appendChild(appNode(n)));
function clock(){let d=new Date(),t=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});$('#locktime').textContent=t;$('#statusleft').textContent=$('#lock').classList.contains('active')?t:t;$('#date').textContent=`${d.getMonth()+1}月${d.getDate()}日 星期${'日一二三四五六'[d.getDay()]}`};setInterval(clock,1000);clock();function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');clock()}let typed='';function dots(){$('#dots').innerHTML=Array.from({length:4},(_,i)=>`<span class="dot ${i<typed.length?'fill':''}"></span>`).join('')};dots();['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(n=>{let b=document.createElement('button');b.className='digit';b.textContent=n;b.onclick=()=>{if(n==='⌫')typed=typed.slice(0,-1);else if(n&&typed.length<4)typed+=n;dots();if(typed.length===4){if(typed===CONFIG.password){show('home');typed='';dots()}else{$('#passmsg').textContent='密码错误，请重试';setTimeout(()=>{typed='';dots();$('#passmsg').textContent=''},500)}}};$('#pad').appendChild(b)});let sy=0;$('#lock').addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});$('#lock').addEventListener('touchend',e=>{if(sy-e.changedTouches[0].clientY>45)show('pass')});$('#lock').addEventListener('mousedown',e=>sy=e.clientY);$('#lock').addEventListener('mouseup',e=>{if(sy-e.clientY>40)show('pass')});$('#globalbar').onclick=()=>{$('#lock').classList.contains('active')?show('pass'):goHome()};function goHome(){$('#appview').classList.remove('show');closeFolder();show('home')};function openFolder(){$('#folder').classList.add('show')};function closeFolder(){$('#folder').classList.remove('show')};let chatStep=0;function openApp(name){closeFolder();if(!$('#home').classList.contains('active'))show('home');$('#appview').classList.add('show');let c=$('#appcontent');c.innerHTML='<h1>'+name+'</h1>';if(name==='KakaoTalk'||name==='信息'){c.innerHTML='<h1>'+name+'</h1><div id="messages"></div><div class="chatinput"><input id="reply" placeholder="输入消息…"><button id="send">发送</button></div>';chatStep=0;appendMsg(CONFIG.chat[0].text,false);$('#send').onclick=()=>{let m=CONFIG.chat[1];appendMsg(m.text,true);$('#reply').value='';setTimeout(()=>appendMsg(CONFIG.chat[2].text,false),800)}}else if(name==='X'){c.innerHTML='<h1>X</h1><div class="hint">私人账号 🔒</div>'+CONFIG.tweets.map(t=>'<div class="item">'+t+'</div>').join('')}else if(name==='电话'){c.innerHTML='<h1>最近通话</h1><div class="item">今天</div><div class="item">未接来电　19:42</div><div class="item">昨天</div><div class="item">已接来电　21:07</div>'}else{c.innerHTML+='<p class="hint">应用界面将在后续版本完善。</p>'}}function appendMsg(t,mine){let b=document.createElement('div');b.className='bubble';if(!mine){b.style.marginLeft='0';b.style.background='#fff'}b.textContent=t;$('#messages').appendChild(b)};
</script></body></html>
